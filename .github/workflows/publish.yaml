name: Publish
on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"

concurrency:
  group: publish
  cancel-in-progress: false

env:
  TZ: Europe/Paris
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI: true

permissions:
  contents: read

jobs:
  code_quality:
    name: Code Quality
    uses: ./.github/workflows/code_quality.yaml

  version:
    name: Compute Release Version
    # Sequenced after code quality: three concurrent jobs OOM-kill svelte-check on the runner.
    needs: [code_quality]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.compute.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Dry-run release to compute the next version
        id: compute
        # The action swallows dry-run output (no version output yet), so run the binary directly.
        # Keep in step with the orochibraru/releaser@v1 ref below.
        env:
          RELEASER_VERSION: "1.2.1"
        run: |
          curl -fsSL -o "$RUNNER_TEMP/releaser" \
            "https://github.com/orochibraru/releaser/releases/download/v$RELEASER_VERSION/releaser-linux-amd64"
          chmod +x "$RUNNER_TEMP/releaser"
          if ! output="$("$RUNNER_TEMP/releaser" -dry-run -rules breaking=patch,feat=patch,docs=patch,refactor=patch 2>&1)"; then
            echo "$output"
            echo "::error::releaser dry run failed, refusing to build images stamped with the wrong version"
            exit 1
          fi
          echo "$output"
          tag="$(echo "$output" | grep -oE '^next release: v[0-9]+\.[0-9]+\.[0-9]+' | grep -oE 'v[0-9.]+$' || true)"
          if [ -n "$tag" ]; then
            echo "This push will release $tag."
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "No release-worthy commits, tagging images with the commit SHA."
            echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Docker Build
    needs: [version]
    uses: ./.github/workflows/docker.yaml
    with:
      image_tag: ${{ needs.version.outputs.tag }}
      latest: true
      image_name: orochibraru/bercail
      registry_name: docker.io
      registry_username: orochibraru
      bake_target: app-ci
    secrets:
      registry_password: ${{ secrets.DOCKERHUB_TOKEN }}

  publish:
    name: Publish ${{ needs.version.outputs.tag }}
    needs: [version, build]
    uses: ./.github/workflows/docker-manifest.yaml
    with:
      image_name: orochibraru/bercail
      registry_name: docker.io
      registry_username: orochibraru
      bake_target: app-ci
    secrets:
      registry_password: ${{ secrets.DOCKERHUB_TOKEN }}

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [publish]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Release
        uses: orochibraru/releaser@v1
        with:
          rules: breaking=patch,feat=patch,docs=patch,refactor=patch
          prepare: bun run prettier --write CHANGELOG.md && bun run package:extension
          artifacts: dist/bercail-extension.zip=bercail-extension-${version}.zip
