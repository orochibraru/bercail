name: Docker Build
# Pushes per-platform images BY DIGEST ONLY. `docker-manifest.yaml` applies the
# pullable tag afterwards, once every platform built.

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        description: "Subpath and image to push to, example myorg/myimage"
        type: string
      image_tag:
        required: true
        description: "Tag to apply to the built image, e.g. pr-123 or v1.2.3"
        type: string
      registry_name:
        required: true
        type: string
      registry_username:
        required: true
        type: string
      bake_target:
        required: true
        description: "Target to build from docker-bake.hcl, e.g. app-ci"
        type: string
      latest:
        required: false
        default: false
        description: "Also tag the image as latest"
        type: boolean
    secrets:
      registry_password:
        required: true
    outputs:
      image:
        description: "Registry path of the built image, without a tag"
        value: ${{ jobs.prepare.outputs.image }}

permissions:
  contents: read

env:
  IMAGE: ${{ inputs.registry_name }}/${{ inputs.image_name }}
  TZ: Europe/Paris
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI: true

jobs:
  prepare:
    name: Matrix & Metadata
    runs-on: ubuntu-latest
    outputs:
      matrix: '["linux/amd64", "linux/arm64"]'
      image: ${{ inputs.registry_name }}/${{ inputs.image_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ inputs.image_tag }}
            type=raw,value=latest,enable=${{ inputs.latest }}

      - name: Rename meta bake definition file
        run: |
          mv "${{ steps.meta.outputs.bake-file }}" "${{ runner.temp }}/bake-meta.json"

      - name: Upload meta bake definition
        uses: actions/upload-artifact@v7
        with:
          name: bake-meta-${{ inputs.bake_target }}
          path: ${{ runner.temp }}/bake-meta.json
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build Images
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Download meta bake definition
        uses: actions/download-artifact@v8
        with:
          name: bake-meta-${{ inputs.bake_target }}
          path: ${{ runner.temp }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - uses: actions/checkout@v7

      - name: Login to Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ inputs.registry_name }}
          username: ${{ inputs.registry_username }}
          password: ${{ secrets.registry_password }}

      - name: Build
        id: bake
        uses: docker/bake-action@v7
        with:
          files: |
            ./docker-bake.hcl
            cwd://${{ runner.temp }}/bake-meta.json
          targets: ${{ inputs.bake_target }}
          set: |
            *.tags=${{ env.IMAGE }}
            *.platform=${{ matrix.platform }}
            *.output=type=image,push-by-digest=true,name-canonical=true,push=true
            ${{ inputs.bake_target }}.cache-from=type=gha,scope=${{ inputs.bake_target }}-${{ env.PLATFORM_PAIR }}
            ${{ inputs.bake_target }}.cache-to=type=gha,mode=max,scope=${{ inputs.bake_target }}-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ fromJSON(steps.bake.outputs.metadata)[inputs.bake_target]['containerimage.digest'] }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ inputs.bake_target }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
